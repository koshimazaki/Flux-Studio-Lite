name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push or a quick follow-up commit should not leave two runs racing.
concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR checks can stop. A main run may already be migrating or
  # deploying production, so let it finish and serialize deployment below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` over `npm install`: the lockfile is committed, so CI installs
      # the exact tree the author tested against.
      - name: Install
        run: npm ci

      # Ordered cheapest-first, so an obvious failure reports in seconds
      # rather than after a full build.
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      # README: "Requires Node 22+ and `ffprobe` from FFmpeg." The server
      # shells out to ffprobe to inspect MP4s, so without it the upload
      # verifier returns 400 and a job never leaves `copying`. Not on the
      # runner image by default. Installed here rather than with the other
      # setup so a formatting or type error still reports in seconds.
      - name: Install ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

      # Not a deploy. Publish the reviewable frontend bundle so this job stays
      # safe on pull requests; the separate production job runs only on main.
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  cloudflare:
    name: Cloudflare boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # Keep the workflow reusable on a tree without the adapter. Wrangler
      # config is present in this repository, so this runs on every PR/main push.
      - name: Detect Cloudflare port
        id: detect
        run: |
          if [ -f wrangler.jsonc ] || [ -f wrangler.toml ] || [ -f wrangler.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Wrangler config found — running boundary checks."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Wrangler config on this ref — skipping."
          fi

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      # The real portability gate. worker/tsconfig.json compiles shared/ and
      # the three portable server modules under "types": [] and lib ES2022 —
      # no Node, no DOM. A stray `node:fs` in the portable layer fails here
      # while every other check stays green.
      - name: Worker types (portable layer stays portable)
        if: steps.detect.outputs.present == 'true'
        run: npm run check:worker

      # The Worker serves ./dist through its ASSETS binding, so wrangler
      # refuses to bundle without it ("assets.directory ... does not exist").
      # Building here keeps this job independent of `verify` rather than
      # chaining the two through an artifact.
      - name: Build assets for the Worker
        if: steps.detect.outputs.present == 'true'
        run: npm run build

      # --dry-run bundles the Worker and validates bindings, compatibility
      # flags and asset config without contacting the API, so it needs no
      # credentials and cannot deploy from a pull request.
      - name: Wrangler config and bundle
        if: steps.detect.outputs.present == 'true'
        run: npx wrangler deploy --dry-run --outdir "${RUNNER_TEMP}/wrangler-dry-run"

      # D1 is SQLite. Replaying the migrations in order against a scratch
      # database catches bad DDL and ordering mistakes before they reach a
      # real database, where partially-applied migrations are expensive.
      - name: D1 migrations replay
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ ! -d migrations ]; then
            echo "No migrations directory — nothing to replay."
            exit 0
          fi
          db="${RUNNER_TEMP}/d1-replay.sqlite"
          rm -f "$db"
          for migration in $(ls migrations/*.sql | sort); do
            echo "Applying ${migration}"
            sqlite3 "$db" < "$migration"
          done
          echo "Resulting schema:"
          sqlite3 "$db" ".tables"

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://fluxstudio.pages.dev
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the production environment."
            exit 1
          fi

      - name: Install
        run: npm ci

      # Build before touching production data. Pages receives this exact bundle
      # only after the additive migrations have succeeded.
      - name: Build production Pages bundle
        run: npm run build:pages

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply flux-studio-lite --remote --config wrangler.pages.json

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-pages.mjs

      - name: Smoke-check production
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 https://fluxstudio.pages.dev/api/health
